<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs by Arshdeep</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax for LaTeX Math Rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


</head>

<body class="blog-page">
    <nav>
        <a class="blog-nav" href="index.html">Home</a>
    </nav>
    <div class="toggle-sidebar" id="toggleSidebar">Other Projects</div>
    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="directory-heading">Directory</div>
        <div id="directory"></div>
    </div>
    <div class="blog-container" id="blog-container"></div>
    <div id="footer-container"></div>


    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            })
            .catch(error => console.error("Error loading footer:", error));
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const blogContainer = document.getElementById("blog-container");
            const directoryContainer = document.getElementById("directory");
            let blogFiles = {
                "projects": [
                    { fileId: "projects-1.md", fileIndex: 1, fileName: "House Price Prediction EDA" },
                    { fileId: "projects-2.md", fileIndex: 2, fileName: "PDF Citation Agent" },
                    { fileId: "projects-3.md", fileIndex: 3, fileName: "National Trend Visualizer" }
                ],
                "experiences": [
                    { fileId: "experiences-1.md", fileIndex: 1, fileName: "Meta Onsite Experience" },
                    { fileId: "experiences-2.md", fileIndex: 2, fileName: "TikTok Onsite Experience" },
                    { fileId: "experiences-3.md", fileIndex: 3, fileName: "Uber Onsite Experience" },
                    { fileId: "experiences-4.md", fileIndex: 4, fileName: "Amazon Onsite Experience" }
                ],
                "leetcode_algorithms": [
                    { fileId: "leetcode_algorithms-1.md", fileIndex: 1, fileName: "Dijkstra Algorithm" },
                    { fileId: "leetcode_algorithms-2.md", fileIndex: 2, fileName: "Bellman-Ford" },
                    { fileId: "leetcode_algorithms-3.md", fileIndex: 3, fileName: "Floyd-Warshall Algorithm" },
                    { fileId: "leetcode_algorithms-4.md", fileIndex: 4, fileName: "Trie (Prefix Tree)" },
                    { fileId: "leetcode_algorithms-5.md", fileIndex: 5, fileName: "Union-Find (Disjoint Set Union or DSU)" },
                    { fileId: "leetcode_algorithms-6.md", fileIndex: 6, fileName: "Topological Sort" },
                    { fileId: "leetcode_algorithms-7.md", fileIndex: 7, fileName: "MST - Prims/Kruskal Algorithm" },
                    { fileId: "leetcode_algorithms-8.md", fileIndex: 8, fileName: "Morris Traversal" },
                    { fileId: "leetcode_algorithms-9.md", fileIndex: 9, fileName: "Monotonic Stack" },
                    { fileId: "leetcode_algorithms-10.md", fileIndex: 10, fileName: "Monotonic Queue" },
                    { fileId: "leetcode_algorithms-11.md", fileIndex: 11, fileName: "Radix Sort" },
                    { fileId: "leetcode_algorithms-12.md", fileIndex: 12, fileName: "Bucket Sort" },
                    { fileId: "leetcode_algorithms-13.md", fileIndex: 13, fileName: "Detect Cycle" },
                    { fileId: "leetcode_algorithms-14.md", fileIndex: 14, fileName: "Backtracking" },
                    { fileId: "leetcode_algorithms-15.md", fileIndex: 15, fileName: "Regex" },
                    { fileId: "leetcode_algorithms-16.md", fileIndex: 16, fileName: "Wormhole Teleportation technique" },
                    { fileId: "leetcode_algorithms-17.md", fileIndex: 17, fileName: "Bipartite graph" },
                    { fileId: "leetcode_algorithms-18.md", fileIndex: 18, fileName: "Cycle Sort" },
                    { fileId: "leetcode_algorithms-19.md", fileIndex: 19, fileName: "Custom Sorting Comparator" },
                    { fileId: "leetcode_algorithms-20.md", fileIndex: 20, fileName: "Fenwick Tree/Binary Indexed Tree" },
                    { fileId: "leetcode_algorithms-21.md", fileIndex: 21, fileName: "Segment Tree" },
                    { fileId: "leetcode_algorithms-22.md", fileIndex: 22, fileName: "KMP - needle in haystack" },
                    { fileId: "leetcode_algorithms-23.md", fileIndex: 23, fileName: "Rabin-Karp/Rolling Hash" },
                    { fileId: "leetcode_algorithms-24.md", fileIndex: 24, fileName: "Line Sweep" },
                    { fileId: "leetcode_algorithms-25.md", fileIndex: 25, fileName: "Dutch Flag Algorithm" }
                ],
                "LLD": [
                    { fileId: "LLD-1.md", fileIndex: 1, fileName: "Hit Counter" },
                    { fileId: "LLD-2.md", fileIndex: 2, fileName: "Twitter" },
                    { fileId: "LLD-3.md", fileIndex: 3, fileName: "Snake Game" },
                    { fileId: "LLD-4.md", fileIndex: 4, fileName: "Memory Allocator" },
                    { fileId: "LLD-5.md", fileIndex: 5, fileName: "Circular Queue" },
                    { fileId: "LLD-6.md", fileIndex: 6, fileName: "TinyURL - Encode and Decode" }
                ]
            };


            function highlightActiveFile(activeFileId) {
                document.querySelectorAll(".file").forEach(fileDiv => {
                    if (fileDiv.dataset.id === activeFileId) {
                        fileDiv.classList.add("active");
                        let folderDiv = fileDiv.parentElement.previousElementSibling;
                        if (folderDiv && folderDiv.classList.contains("folder")) {
                            folderDiv.classList.add("active");
                        }
                    } else {
                        fileDiv.classList.remove("active");
                    }
                });
            }

            function renderDirectory() {
                directoryContainer.innerHTML = "";
                Object.keys(blogFiles).forEach(folder => {
                    let folderDiv = document.createElement("div");
                    folderDiv.classList.add("folder");
                    folderDiv.innerHTML = `<i class='fas fa-folder' style="color: #FFD43B;"></i> ${folder}`;
                    directoryContainer.appendChild(folderDiv);

                    let fileList = document.createElement("div");
                    (blogFiles[folder] || []).forEach(({ fileName, fileIndex, fileId }) => {
                        let fileDiv = document.createElement("div");
                        fileDiv.classList.add("file");
                        fileDiv.innerHTML = `<i class='fas fa-file-alt' style="color: #ADD2FD;"></i> ${fileName}`;
                        fileDiv.dataset.file = `${fileIndex}.md`;
                        fileDiv.dataset.folder = folder;
                        fileDiv.dataset.id = fileId;
                        fileDiv.addEventListener("click", () => {
                            loadBlog(folder, `${fileIndex}.md`, fileId);
                            document.querySelectorAll(".file").forEach(el => el.classList.remove("active"));
                            fileDiv.classList.add("active");
                            document.querySelectorAll(".folder").forEach(el => el.classList.remove("active"));
                            folderDiv.classList.add("active");
                        });
                        fileList.appendChild(fileDiv);
                    });
                    directoryContainer.appendChild(fileList);
                });
            }

            async function initialize() {
                renderDirectory();
                loadActiveContent();
            }

            function loadActiveContent() {
                const urlParams = new URLSearchParams(window.location.search);
                const name = urlParams.get("name");

                if (name) {
                    const [folder, file] = name.split("/");
                    const fileId = `${folder}-${file}`;
                    loadBlog(folder, file, fileId);
                    highlightActiveFile(fileId);
                }
            }

            async function loadBlog(folder, file, fileId) {
                let filePath = `blogs/${folder}/${file}`;
                try {
                    let response = await fetch(filePath);
                    if (!response.ok) throw new Error("File not found");
                    let content = await response.text();
                    const regex = new RegExp("<!--\\s*([\\s\\S]*?)\\s*-->", "m");
                    let match = content.match(regex);
                    let hiddenUrl = match ? match[1] : null;
                    let renderedHTML = marked.parse(content);
                    blogContainer.innerHTML = `<div class='blog-entry'>${renderedHTML}</div>`;

                    // Convert first <u> tag into a link (if any hidden URL exists)
                    convertFirstUnderlineToLink(blogContainer, hiddenUrl);

                    if (window.MathJax) {
                        window.MathJax.typesetPromise([blogContainer]).catch((err) => console.warn("MathJax Error:", err));
                    }

                    document.querySelectorAll("pre code").forEach((block) => {
                        hljs.highlightElement(block);
                    });

                    highlightActiveFile(fileId);
                    window.history.pushState({}, "", `?name=${folder}/${file}`);
                } catch (error) {
                    console.error("Error loading blog:", error);
                }
            }

            initialize();

            function convertFirstUnderlineToLink(container, url) {
                const underlineElement = container.querySelector("u"); // Find the first <u> tag
                if (underlineElement && url) {
                    let text = underlineElement.innerText.trim();

                    let anchor = document.createElement("a");
                    anchor.href = url;
                    anchor.innerText = text;
                    anchor.target = "_blank"; // Open in new tab
                    anchor.rel = "noopener noreferrer"; // Security best practice
                    anchor.style.textDecoration = "underline"; // Keep the underline look
                    anchor.style.color = "#007BFF"; // Make it look like a link

                    underlineElement.replaceWith(anchor);
                }
            }

            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");
            const toggleSidebar = document.getElementById("toggleSidebar");

            toggleSidebar.addEventListener("click", function () {
                sidebar.classList.toggle("open");
                overlay.classList.toggle("active");
            });

            overlay.addEventListener("click", function () {
                sidebar.classList.remove("open");
                overlay.classList.remove("active");
            });

            document.addEventListener("click", function (event) {
                if (!sidebar.contains(event.target) && !toggleSidebar.contains(event.target)) {
                    if (window.innerWidth < 768) {
                        sidebar.classList.remove("open");
                    }
                }
            });
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            hljs.highlightAll();
        });
    </script>
</body>

</html>
