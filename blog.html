<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs by Arshdeep</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax for LaTeX Math Rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


</head>

<body class="blog-page">
    <nav>
        <a class="blog-nav" href="index.html">Home</a>
    </nav>
    <div class="toggle-sidebar" id="toggleSidebar">Other Projects</div>
    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="directory-heading">Directory</div>
        <div id="directory"></div>
    </div>
    <div class="blog-container" id="blog-container"></div>
    <div id="footer-container"></div>


    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            })
            .catch(error => console.error("Error loading footer:", error));
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const blogContainer = document.getElementById("blog-container");
            const directoryContainer = document.getElementById("directory");
            let folders = ["projects", "experiences", "leetcode_algorithms", "LLD"];
            let blogFiles = {};

            function highlightActiveFile(activeFileId) {
                document.querySelectorAll(".file").forEach(fileDiv => {
                    if (fileDiv.dataset.id === activeFileId) {
                        fileDiv.classList.add("active");
                        let folderDiv = fileDiv.parentElement.previousElementSibling;
                        if (folderDiv && folderDiv.classList.contains("folder")) {
                            folderDiv.classList.add("active");
                        }
                    } else {
                        fileDiv.classList.remove("active");
                    }
                });
            }

            async function fetchBlogs(folder) {
                blogFiles[folder] = [];

                while (true) {
                    let fileIndex = blogFiles[folder].length + 1;
                    let filePath = `blogs/${folder}/${fileIndex}.md`;
                    try {
                        let response = await fetch(filePath);
                        if (!response.ok) throw new Error("File not found");
                        let content = await response.text();
                        let match = content.match(/<u>(.*?)<\/u>/);
                        let fileName = match ? match[1] : `Post ${fileIndex}`;
                        let fileId = `${folder}-${fileIndex}.md`;
                        blogFiles[folder].push({ fileName, fileIndex, fileId });
                    } catch (error) {
                        break;
                    }
                }
            }


            function renderDirectory() {
                directoryContainer.innerHTML = "";
                folders.forEach(folder => {
                    let folderDiv = document.createElement("div");
                    folderDiv.classList.add("folder");
                    folderDiv.innerHTML = `<i class='fas fa-folder' style="color: #FFD43B;"></i> ${folder}`;
                    directoryContainer.appendChild(folderDiv);

                    let fileList = document.createElement("div");
                    (blogFiles[folder] || []).forEach(({ fileName, fileIndex, fileId }) => {
                        let fileDiv = document.createElement("div");
                        fileDiv.classList.add("file");
                        fileDiv.innerHTML = `<i class='fas fa-file-alt' style="color: #ADD2FD;"></i> ${fileName}`;
                        fileDiv.dataset.file = `${fileIndex}.md`;
                        fileDiv.dataset.folder = folder;
                        fileDiv.dataset.id = fileId;
                        fileDiv.addEventListener("click", () => {
                            loadBlog(folder, `${fileIndex}.md`, fileId);
                            document.querySelectorAll(".file").forEach(el => el.classList.remove("active"));
                            fileDiv.classList.add("active");
                            document.querySelectorAll(".folder").forEach(el => el.classList.remove("active"));
                            folderDiv.classList.add("active");
                        });
                        fileList.appendChild(fileDiv);
                    });
                    directoryContainer.appendChild(fileList);
                });
            }

            async function initialize() {
                for (const folder of folders) {
                    await fetchBlogs(folder);
                }
                renderDirectory();
                loadActiveContent();
            }

            function loadActiveContent() {
                const urlParams = new URLSearchParams(window.location.search);
                const name = urlParams.get("name");

                if (name) {
                    const [folder, file] = name.split("/");
                    const fileId = `${folder}-${file}`;
                    loadBlog(folder, file, fileId);
                    highlightActiveFile(fileId);
                }
            }

            async function loadBlog(folder, file, fileId) {
                let filePath = `blogs/${folder}/${file}`;
                try {
                    let response = await fetch(filePath);
                    if (!response.ok) throw new Error("File not found");
                    let content = await response.text();
                    const regex = new RegExp("<!--\\s*([\\s\\S]*?)\\s*-->", "m");
                    let match = content.match(regex);
                    let hiddenUrl = match ? match[1] : null;
                    let renderedHTML = marked.parse(content);
                    blogContainer.innerHTML = `<div class='blog-entry'>${renderedHTML}</div>`;

                    // Convert first <u> tag into a link (if any hidden URL exists)
                    convertFirstUnderlineToLink(blogContainer, hiddenUrl);

                    if (window.MathJax) {
                        window.MathJax.typesetPromise([blogContainer]).catch((err) => console.warn("MathJax Error:", err));
                    }

                    document.querySelectorAll("pre code").forEach((block) => {
                        hljs.highlightElement(block);
                    });

                    highlightActiveFile(fileId);
                    window.history.pushState({}, "", `?name=${folder}/${file}`);
                } catch (error) {
                    console.error("Error loading blog:", error);
                }
            }

            initialize();

            function convertFirstUnderlineToLink(container, url) {
                const underlineElement = container.querySelector("u"); // Find the first <u> tag
                if (underlineElement && url) {
                    let text = underlineElement.innerText.trim();

                    let anchor = document.createElement("a");
                    anchor.href = url;
                    anchor.innerText = text;
                    anchor.target = "_blank"; // Open in new tab
                    anchor.rel = "noopener noreferrer"; // Security best practice
                    anchor.style.textDecoration = "underline"; // Keep the underline look
                    anchor.style.color = "#007BFF"; // Make it look like a link

                    underlineElement.replaceWith(anchor);
                }
            }

            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");
            const toggleSidebar = document.getElementById("toggleSidebar");

            toggleSidebar.addEventListener("click", function () {
                sidebar.classList.toggle("open");
                overlay.classList.toggle("active");
            });

            overlay.addEventListener("click", function () {
                sidebar.classList.remove("open");
                overlay.classList.remove("active");
            });

            document.addEventListener("click", function (event) {
                if (!sidebar.contains(event.target) && !toggleSidebar.contains(event.target)) {
                    if (window.innerWidth < 768) {
                        sidebar.classList.remove("open");
                    }
                }
            });
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            hljs.highlightAll();
        });
    </script>
</body>

</html>
